<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼성역 맛집 투표</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --accent:#4f46e5; --accent-soft:#eef2ff; --line:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Pretendard","Malgun Gothic",sans-serif; }
  .wrap { max-width:640px; margin:40px auto; padding:0 16px; }
  .card { background:var(--card); border-radius:16px; padding:32px; box-shadow:0 4px 20px rgba(0,0,0,.06); }
  h1 { margin:0 0 6px; font-size:26px; }
  .sub { color:var(--muted); margin:0 0 28px; }
  .q { margin-bottom:26px; }
  .q > label, .q > .title { display:block; font-weight:600; margin-bottom:10px; }
  .hint { font-weight:400; color:var(--muted); font-size:13px; margin-left:6px; }
  .shops { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; }
  .shop { border:1.5px solid var(--line); border-radius:12px; padding:14px; cursor:pointer; user-select:none; transition:.15s; }
  .shop input { display:none; }
  .shop b { display:block; font-size:15px; }
  .shop small { color:var(--muted); }
  .shop:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); }
  .shop:has(input:checked) b::after { content:" ✓"; color:var(--accent); }
  input[type=text], textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; }
  textarea { min-height:80px; resize:vertical; }
  button { width:100%; padding:14px; border:0; border-radius:12px; background:var(--accent); color:#fff; font-size:16px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .done { display:none; text-align:center; padding:30px 0; }
  .done .big { font-size:48px; }
  .done a { color:var(--accent); font-weight:700; }
  .note { margin-top:16px; font-size:13px; color:var(--muted); text-align:center; }
  .note a { color:var(--muted); }

  /* AI 입력창 */
  .ai { margin-top:16px; background:var(--card); border-radius:16px; padding:22px; box-shadow:0 4px 20px rgba(0,0,0,.06); }
  .ai h2 { margin:0 0 4px; font-size:17px; }
  .ai p.hint-line { margin:0 0 12px; color:var(--muted); font-size:13px; }
  .ai form { display:flex; gap:8px; }
  .ai input { flex:1; min-width:0; padding:12px; border:1px solid #e5e7eb; border-radius:10px; font:inherit; }
  .ai button { width:auto; flex:none; padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:700; font-size:15px; cursor:pointer; }
  .ai button:disabled { opacity:.6; cursor:default; }
  .ai .out { margin-top:12px; font-size:14px; line-height:1.6; white-space:pre-wrap; }
  .ai .out:empty { display:none; }
  .ai .out.err { color:#b91c1c; }
  .ai .log { list-style:none; margin:12px 0 0; padding:0; font-size:14px; line-height:1.6; }
  .ai .log li { padding:10px 0; border-top:1px solid #eef0f6; white-space:pre-wrap; }
  .ai .log li.q { color:var(--muted); font-weight:600; }
  .ai .log li.err { color:#b91c1c; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <form id="form" onsubmit="eval(document.getElementById('submitcode').text); return false;">
      <h1>🍽️ 삼성역 맛집 투표</h1>
      <p class="sub">가 봤거나 가고 싶은 곳을 모두 골라 주세요.</p>

      <div class="q">
        <label for="nickname">닉네임 <span class="hint">비워 두면 익명</span></label>
        <input type="text" id="nickname" maxlength="20" placeholder="예: 점심탐험가">
      </div>

      <div class="q">
        <span class="title">맛집 고르기 <span class="hint">여러 곳 선택 가능</span></span>
        <div class="shops" id="shops">불러오는 중...</div>
      </div>

      <div class="q">
        <label for="comment">한줄평</label>
        <textarea id="comment" maxlength="200" placeholder="추천 메뉴나 꿀팁을 적어 주세요"></textarea>
      </div>

      <button type="submit">투표하기</button>
    </form>

    <div class="done" id="done">
      <div class="big">🎉</div>
      <h1>투표 완료!</h1>
      <p class="sub">참여해 주셔서 고마워요.</p>
      <a href="/result">결과 보러 가기 →</a>
    </div>
  </div>
  <section class="ai" id="ai-vote">
    <h2>✍️ 말로 투표하기</h2>
    <p class="hint-line">예: "송 칼국수랑 케르반 좋았어요. 닉네임은 점심왕, 송은 수제비 추천" → AI가 알아서 투표해요.</p>
    <form id="ai-vote-form">
      <input type="text" id="ai-vote-text" maxlength="500" placeholder="어떤 가게가 좋았는지 편하게 적어 주세요" autocomplete="off">
      <button type="submit">AI로 투표</button>
    </form>
    <div class="out" id="ai-vote-out"></div>
  </section>
  <p class="note">※ 투표는 이 노트북의 서버를 거쳐 DB(survey.db)에 저장돼요. <a href="/result">결과 보기</a></p>
</div>

<script>
  // jQuery 1.4.2 쓰다가 뺌 (IE6 때문에)
  // 비동기로 가져옴
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/api/restaurants', false);
  try { xhr.send(null); } catch (e) { }
  if (xhr.status == 200) {
    var list = JSON.parse(xhr.responseText);
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var s1 = String(list[i].id).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      var s2 = String(list[i].name).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      var s3 = String(list[i].category).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      html = html + '\n      <label class="shop"><input type="checkbox" name="pick" value="' + s1 + '">\n        <b>' + s2 + '</b><small>' + s3 + '</small></label>';
    }
    document.getElementById('shops').innerHTML = html;
  } else {
    document.getElementById('shops').innerHTML = '서버에 연결하지 못했어요.';
  }
  //document.getElementById('shops').innerHTML = '<label>허머스키친</label>';  // 테스트용 (지우지 마세요)
</script>
<!-- 투표 전송 (서버 안 거치고 DB에 바로 저장함) -->
<script type="text/x-legacy" id="submitcode">
  var picks = [];
  var cbs = document.getElementsByName('pick');
  for (var i = 0; i < cbs.length; i++) {
    if (cbs[i].checked == true) { picks.push(cbs[i].value); }
  }
  if (picks.length == 0) {
    alert('가게를 한 곳 이상 골라 주세요.');
  } else {
    var btn = document.getElementById('form').getElementsByTagName('button')[0];
    btn.disabled = true; btn.innerHTML = '보내는 중...';
    var x2 = new XMLHttpRequest();
    x2.open('POST', '/api/votes', false);
    x2.setRequestHeader('Content-Type', 'application/json');
    var ok = 0;
    var em = '저장 실패';
    try {
      x2.send(JSON.stringify({ picks: picks, nickname: document.getElementById('nickname').value, comment: document.getElementById('comment').value }));
      if (x2.status == 201 || x2.status == 200) { ok = 1; }
      else { try { em = JSON.parse(x2.responseText).error || em; } catch (e2) { } }
    } catch (e) { em = e.message; }
    if (ok == 1) {
      document.getElementById('form').style.display = 'none';
      document.getElementById('done').style.display = 'block';
    } else {
      alert('투표하지 못했어요: ' + em);
      btn.disabled = false; btn.innerHTML = '투표하기';
    }
  }
</script>
<script>
  // AI로 투표: 자연어 → 서버(/api/ai/vote)가 OpenRouter로 해석해 바로 저장

  async function aiPost(url, body) {
    var res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    var data = {};
    try { data = await res.json(); } catch (e) { }
    if (!res.ok) throw new Error(data.error || ('오류 ' + res.status));
    return data;
  }

  document.getElementById('ai-vote-form').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var input = document.getElementById('ai-vote-text');
    var out = document.getElementById('ai-vote-out');
    var btn = this.querySelector('button');
    var text = input.value.trim();
    if (!text) { input.focus(); return; }
    btn.disabled = true; btn.textContent = '투표하는 중...';
    out.className = 'out'; out.textContent = '';
    try {
      var d = await aiPost('/api/ai/vote', { text: text });
      out.textContent = '✅ ' + (d.reply || '투표했어요.') + '\n선택: ' + d.picks.join(', ')
        + (d.nickname ? ' · 닉네임: ' + d.nickname : '') + (d.comment ? '\n한줄평: ' + d.comment : '');
      input.value = '';
    } catch (e) {
      out.className = 'out err'; out.textContent = e.message;
    }
    btn.disabled = false; btn.textContent = 'AI로 투표';
  });
</script>
</body>
</html>
