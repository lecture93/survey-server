<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>맛집 투표 결과</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --accent:#4f46e5; --track:#eef0f6; --gold:#f59e0b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Pretendard","Malgun Gothic",sans-serif; }
  .wrap { max-width:860px; margin:40px auto; padding:0 16px; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:24px; }
  h1 { margin:0 0 6px; font-size:28px; }
  .sub { color:var(--muted); margin:0; }
  .btn { padding:10px 16px; border-radius:10px; background:var(--accent); color:#fff; text-decoration:none; font-weight:700; font-size:14px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:16px; }
  .kpi, .card { background:var(--card); border-radius:16px; padding:22px; box-shadow:0 4px 20px rgba(0,0,0,.06); }
  .kpi .label { color:var(--muted); font-size:14px; }
  .kpi .value { font-size:30px; font-weight:800; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card { margin-bottom:16px; }
  .card h2 { margin:0 0 16px; font-size:17px; }
  .row { display:grid; grid-template-columns:34px 150px 1fr 80px; align-items:center; gap:10px; margin-bottom:12px; font-size:14px; }
  .rank { font-weight:800; color:var(--muted); text-align:center; }
  .row.top .rank { color:var(--gold); font-size:18px; }
  .name b { display:block; }
  .name small { color:var(--muted); }
  .bar { height:16px; background:var(--track); border-radius:999px; overflow:hidden; }
  .bar i { display:block; height:100%; background:#a5b4fc; border-radius:999px; transition:width .4s; }
  .row.top .bar i { background:var(--accent); }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .num small { color:var(--muted); }
  @media (max-width:560px){ .row { grid-template-columns:28px 1fr 64px; } .row .bar { grid-column:2 / -1; grid-row:2; } }
  .comments { list-style:none; padding:0; margin:0; }
  .comments li { padding:12px 0; border-bottom:1px solid var(--track); font-size:14px; }
  .comments li:last-child { border-bottom:0; }
  .meta { display:block; color:var(--muted); font-size:12px; margin-top:4px; }
  .note { margin-top:8px; font-size:13px; color:var(--muted); text-align:center; }

  /* AI 입력창 */
  .ai { margin-top:16px; background:var(--card); border-radius:16px; padding:22px; box-shadow:0 4px 20px rgba(0,0,0,.06); }
  .ai h2 { margin:0 0 4px; font-size:17px; }
  .ai p.hint-line { margin:0 0 12px; color:var(--muted); font-size:13px; }
  .ai form { display:flex; gap:8px; }
  .ai input { flex:1; min-width:0; padding:12px; border:1px solid #e5e7eb; border-radius:10px; font:inherit; }
  .ai button { width:auto; flex:none; padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:700; font-size:15px; cursor:pointer; }
  .ai button:disabled { opacity:.6; cursor:default; }
  .ai .out { margin-top:12px; font-size:14px; line-height:1.6; white-space:pre-wrap; }
  .ai .out:empty { display:none; }
  .ai .out.err { color:#b91c1c; }
  .ai .log { list-style:none; margin:12px 0 0; padding:0; font-size:14px; line-height:1.6; }
  .ai .log li { padding:10px 0; border-top:1px solid #eef0f6; white-space:pre-wrap; }
  .ai .log li.q { color:var(--muted); font-weight:600; }
  .ai .log li.err { color:#b91c1c; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>🍽️ 삼성역 맛집 투표 결과</h1>
      <p class="sub">여러 곳 중복 선택 · 득표순</p>
    </div>
    <a class="btn" href="/api/export.csv">CSV 내려받기</a>
  </div>

  <div class="kpis" id="kpis"></div>
  <div class="card"><h2>득표 순위</h2><div id="ranking"></div></div>
  <div class="card"><h2>한줄평</h2><ul class="comments" id="comments"></ul></div>

  <section class="ai" id="ai-ask">
    <h2>🤖 결과에 대해 물어보기</h2>
    <p class="hint-line">예: "1위는 왜 1위야?", "한줄평에서 많이 추천한 메뉴는?", "중동 음식 좋아하면 어디 가?"</p>
    <form id="ai-ask-form">
      <input type="text" id="ai-ask-text" maxlength="300" placeholder="투표 결과에 대해 물어보세요" autocomplete="off">
      <button type="submit">물어보기</button>
    </form>
    <ul class="log" id="ai-ask-log"></ul>
  </section>
  <p class="note">서버 DB에서 5초마다 새로 읽어와요 · 마지막 갱신 <span id="updated">-</span></p>
</div>

<!-- 결과 그리기 (1분마다) -->
<script type="text/x-legacy" id="loadcode">
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/api/results', false);
    x.send(null);
    var d = JSON.parse(x.responseText);
    var leader = '-';
    if (d.voters && d.ranking[0].votes) { leader = d.ranking[0].name; }
    leader = String(leader).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    document.getElementById('kpis').innerHTML = ''
      + '\n        <div class="kpi"><div class="label">참여 인원</div><div class="value">' + d.voters + '명</div></div>'
      + '\n        <div class="kpi"><div class="label">현재 1위</div><div class="value">' + leader + '</div></div>'
      + '\n        <div class="kpi"><div class="label">총 표 수</div><div class="value">' + d.totalVotes + '표</div></div>';

    var max = 1;
    for (var i = 0; i < d.ranking.length; i++) { if (d.ranking[i].votes > max) { max = d.ranking[i].votes; } }
    var rank = 0; var prev = null; var h = '';
    for (var i = 0; i < d.ranking.length; i++) {
      var r = d.ranking[i];
      if (r.votes !== prev) { rank = i + 1; prev = r.votes; }   // 동점이면 다음 순위로
      var cls = 'row';
      if (r.votes > 0 && rank <= 3) { cls = 'row top'; }
      h = h + '<div class="' + cls + '">'
        + '\n          <span class="rank">' + rank + '</span>'
        + '\n          <span class="name"><b>' + String(r.name).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;') + '</b><small>' + String(r.category).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;') + '</small></span>'
        + '\n          <div class="bar"><i style="width:' + (r.votes / max * 100) + '%"></i></div>'
        + '\n          <span class="num">' + r.votes + '표 <small>' + r.pct + '%</small></span></div>';
    }
    document.getElementById('ranking').innerHTML = h;

    var h2 = '';
    if (d.comments.length == 0) {
      h2 = '<li style="color:var(--muted)">아직 한줄평이 없어요.</li>';
    }
    for (var i = 0; i < d.comments.length; i++) {
      var cm = d.comments[i];
      h2 = h2 + '<li>' + String(cm.text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;')
        + '\n            <span class="meta">' + String(cm.nickname).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;')
        + ' · ' + String(cm.picks.join(', ')).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;')
        + ' · ' + String(cm.at).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;') + '</span></li>';
    }
    document.getElementById('comments').innerHTML = h2;
    document.getElementById('updated').innerHTML = new Date().toLocaleTimeString('ko-KR');
  } catch (err) {
    document.getElementById('updated').innerHTML = '서버 연결 실패';
  }
</script>
<script>
  // 최초 1회만 실행
  eval(document.getElementById('loadcode').text);
  setInterval("eval(document.getElementById('loadcode').text)", 5000);
</script>
<script>
  // 결과 분석 Q&A: 서버(/api/ai/ask)가 현재 결과·한줄평을 근거로 답한다

  async function aiPost(url, body) {
    var res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    var data = {};
    try { data = await res.json(); } catch (e) { }
    if (!res.ok) throw new Error(data.error || ('오류 ' + res.status));
    return data;
  }

  document.getElementById('ai-ask-form').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var input = document.getElementById('ai-ask-text');
    var log = document.getElementById('ai-ask-log');
    var btn = this.querySelector('button');
    var q = input.value.trim();
    if (!q) { input.focus(); return; }
    var qi = document.createElement('li'); qi.className = 'q'; qi.textContent = 'Q. ' + q;
    var ai = document.createElement('li'); ai.textContent = '분석하는 중...';
    log.prepend(ai); log.prepend(qi);
    btn.disabled = true; input.value = '';
    try {
      ai.textContent = (await aiPost('/api/ai/ask', { question: q })).answer;
    } catch (e) {
      ai.className = 'err'; ai.textContent = e.message;
    }
    btn.disabled = false; input.focus();
  });
</script>
</body>
</html>
